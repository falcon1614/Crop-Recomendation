<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crop Recommendation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-field font-sans">

  <!-- Navbar -->
  <nav class="bg-soil shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-white font-display text-xl font-bold tracking-wide">
        🌾 CropAdvisor
      </a>
      <div class="hidden md:flex gap-6 text-sm text-green-200 font-medium">
        <a href="#" class="hover:text-white transition">Home</a>
        <a href="#" class="hover:text-white transition">Contact</a>
        <a href="#" class="hover:text-white transition">About</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="text-center py-14 px-4">
    <h1 class="font-display text-5xl text-green-900 font-bold drop-shadow-sm">Crop Recommendation System</h1>
    <p class="mt-3 text-green-700 text-lg font-medium">Enter your soil & climate data to get the best crop suggestion 🌱</p>
  </header>

  <!-- Main Card -->
  <main class="max-w-4xl mx-auto px-4 pb-16">
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">

      <!-- Form Section -->
      <div class="p-8 md:p-12">
        <form action="/predict" method="POST" id="cropForm">

          <!-- Soil Nutrients -->
          <h2 class="section-title">🧪 Soil Nutrients</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
            <div class="input-group">
              <label for="Nitrogen">Nitrogen (N)</label>
              <input type="number" id="Nitrogen" name="Nitrogen" placeholder="e.g. 90" class="form-input" required />
            </div>
            <div class="input-group">
              <label for="Phosporus">Phosphorus (P)</label>
              <input type="number" id="Phosporus" name="Phosporus" placeholder="e.g. 42" class="form-input" required />
            </div>
            <div class="input-group">
              <label for="Potassium">Potassium (K)</label>
              <input type="number" id="Potassium" name="Potassium" placeholder="e.g. 43" class="form-input" required />
            </div>
          </div>

          <!-- Climate -->
          <h2 class="section-title mt-10">🌦️ Climate Conditions</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
            <div class="input-group">
              <label for="Temperature">Temperature (°C)</label>
              <input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="e.g. 20.8" class="form-input" required />
            </div>
            <div class="input-group">
              <label for="Humidity">Humidity (%)</label>
              <input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="e.g. 82.0" class="form-input" required />
            </div>
            <div class="input-group">
              <label for="Ph">Soil pH</label>
              <input type="number" step="0.01" id="Ph" name="Ph" placeholder="e.g. 6.5" class="form-input" required />
            </div>
          </div>

          <!-- Rainfall -->
          <h2 class="section-title mt-10">🌧️ Rainfall</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
            <div class="input-group">
              <label for="Rainfall">Rainfall (mm)</label>
              <input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="e.g. 202.9" class="form-input" required />
            </div>
          </div>

          <!-- Submit -->
          <div class="mt-10 text-center">
            <button type="submit" class="submit-btn">
              Get Crop Recommendation →
            </button>
          </div>

        </form>
      </div>

      <!-- Result Section -->
      {% if result %}
      <div class="result-banner">
        <div class="flex flex-col md:flex-row items-center gap-6">
          <img src="/static/img.jpg" alt="Crop" class="w-32 h-32 rounded-2xl object-cover shadow-md border-4 border-white" />
          <div>
            <p class="text-green-200 text-sm font-semibold uppercase tracking-widest mb-1">Recommended Crop</p>
            <h3 class="text-white font-display text-3xl font-bold">{{ result }}</h3>
          </div>
        </div>
      </div>
      {% endif %}

    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
